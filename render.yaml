# Render Blueprint for the NutriMatch backend (Django + Channels on daphne).
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked
# `sync: false` are asked for on the first deploy (copy them from your local
# backend/.env; never commit them). The database is Neon Postgres
# (DATABASE_URL); the frontend is deployed separately (Vercel).
services:
  - type: web
    name: nutrimatch-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # The free plan has no pre-deploy step or shell, so migrations run on start.
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT nutrimatch_api.asgi:application
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # The frontend's address, e.g. https://nutrimatch.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_HOST_USER
        sync: false
      - key: GMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        sync: false
