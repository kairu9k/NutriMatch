<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — NutriMatch</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="nutrimatch.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="auth-visual-content">
      <a href="landing.html" class="d-flex align-items-center gap-2 text-decoration-none mb-5">
        <img src="https://placehold.co/36x36/D4A017/1a3a1a?text=N" alt="" style="width:36px;height:36px;border-radius:6px;">
        <span style="font-size:1.25rem;font-weight:700;"><span style="color:#fff;">Nutri</span><span style="color:var(--gold-600);">Match</span></span>
      </a>
    </div>
    <div class="auth-quote">
      "Your health data is encrypted and never shared without your consent."
      <div class="auth-quote-attrib">NUTRIMATCH PRIVACY COMMITMENT</div>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h1 class="display-heading mb-2" style="font-size: 1.85rem;">Set a New Password</h1>
      <p class="text-muted-nutri mb-4">Choose a strong password you haven't used before.</p>

      <form onsubmit="return false;">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control mb-1" placeholder="••••••••">
        <div class="form-hint mb-3">Min. 8 characters, with letters and numbers.</div>

        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control mb-4" placeholder="••••••••">

        <button type="button" class="btn btn-primary btn-block" onclick="window.location.href='login.html'">Reset Password</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
