<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Went Wrong — NutriMatch</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="nutrimatch.css">
<style>
  .error-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--forest-700); position: relative; overflow: hidden; padding: 24px; }
  .error-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 620px; height: 620px; border-radius: 50%; background: rgba(255,255,255,0.03); }
  .error-content { position: relative; z-index: 1; text-align: center; max-width: 480px; }
  .error-code { font-family: var(--font-display); font-size: 7rem; font-weight: 700; color: var(--gold-600); line-height: 1; font-style: italic; }
</style>
</head>
<body>

<div class="error-shell">
  <div class="error-circle"></div>
  <div class="error-content">
    <div class="error-code">500</div>
    <h1 class="display-heading mt-3" style="color:#fff; font-size: 1.8rem;">Something Went Wrong on Our End</h1>
    <p class="mt-3 mb-4" style="color: var(--forest-200);">We're already looking into it. Your data is safe — please try again in a few minutes.</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="landing.html" class="btn btn-gold">Back to Home</a>
      <a href="contact.html" class="btn btn-outline-light">Contact Support</a>
    </div>
    <p class="mt-4" style="font-size: 0.75rem; color: var(--forest-300);">Error reference: NM-500-A19F2C</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
